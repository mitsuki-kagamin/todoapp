[package]
name = "untitled"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
env_logger = "0.11.11"
dotenvy = "0.15.7"
arc-swap = "1.9.2"
hashbrown = { version = "0.17.1", features = ["rayon"] }
mimalloc = "0.1.52"
flume = "0.12.0"
sonic-rs = "0.5.8"
postgres = "0.19.14"
mio = { version = "1.2.3", features = ["net", "os-ext", "os-poll"] }
bytes = "1.12.1"
nohash-hasher = "0.2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[profile.release.package."*"]
opt-level = 3
